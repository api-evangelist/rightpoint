name: Rightpoint
description: >-
  Rightpoint is a global experience consultancy, now fully integrated into the
  Genpact brand, that designs and builds customer and employee experiences for
  enterprise organizations. Its practice spans agentic experience, digital
  workspace, experience advisory, intelligent content, omnichannel experience,
  and personalization and experimentation, delivered through deep platform
  partnerships with Adobe, Microsoft, Optimizely, and Sitecore. As a services
  and consulting firm rather than an API product company, Rightpoint publishes
  no public developer portal, API documentation, or machine-readable API
  surface; this profile captures its identity and web presence within the API
  Evangelist network. It was surfaced as a portfolio company of Canaan Partners.
